<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Safari Boot Test</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f7;color:#1d1d1f}
    main{max-width:680px;margin:0 auto;padding:32px 18px}
    .card{background:white;border-radius:18px;padding:20px;margin:14px 0;border:1px solid rgba(0,0,0,.08)}
    h1{font-size:32px;margin:0 0 10px}.ok{color:#18763b;font-weight:700}.muted{color:#6e6e73;line-height:1.5}
    button{width:100%;min-height:52px;border:0;border-radius:14px;background:#0071e3;color:white;font-size:17px;font-weight:700;padding:12px}
    pre{white-space:pre-wrap;background:#111114;color:#f5f5f7;border-radius:14px;padding:14px;min-height:90px}
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="ok">STATIC PAGE LOADED ✓</div>
      <h1>Safari Boot Test</h1>
      <p class="muted">Build 2026-08-26f. This page loads no AI model, no Worker, no Transformers.js, no Firebase and no OpenAI. It does not touch WebGPU until you press the button.</p>
    </div>

    <div class="card">
      <button id="gpuButton" type="button">Check WebGPU manually</button>
      <pre id="log">Waiting. WebGPU has NOT been touched yet.</pre>
    </div>
  </main>

  <script>
    const button = document.getElementById('gpuButton');
    const log = document.getElementById('log');
    button.addEventListener('click', async () => {
      button.disabled = true;
      log.textContent = 'Button pressed. Checking navigator.gpu…';
      try {
        if (!navigator.gpu) {
          log.textContent += '\nWebGPU API: unavailable';
          return;
        }
        log.textContent += '\nWebGPU API: available\nRequesting GPU adapter…';
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) throw new Error('No GPU adapter returned');
        log.textContent += '\nGPU adapter: ready';
        log.textContent += `\nshader-f16: ${adapter.features.has('shader-f16') ? 'yes' : 'no'}`;
        log.textContent += '\n\nPASS ✓';
      } catch (error) {
        log.textContent += `\nERROR: ${error && error.message ? error.message : String(error)}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
